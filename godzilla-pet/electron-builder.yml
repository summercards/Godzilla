# 巨兽都市桌宠 · Windows 打包配置
#
# 存在这个文件的原因很具体：以前打 Windows 包靠命令行参数，参数没记录在仓库里，
# 结果重打包时 install 出来的 exe 掉回了 Electron 默认图标（日志里那句
# "default Electron icon is used / application icon is not set"）。
# 打包结果不需要进版本库（见根 .gitignore），但「怎么打出来」必须进版本库。
#
# 用法（在 godzilla-pet/ 下）：
#   npx electron-builder --win
#
# 产物落在 dist/：win-unpacked/（免安装目录）+ 巨兽都市桌宠 Setup <version>.exe
#
# 这里刻意不写 appId：留空时 electron-builder 按 package.json 的 name 推导
# （com.electron.godzilla-pet），与历史安装包保持一致，避免换掉应用身份、
# 让老用户升级时被当成另一个程序。
appId: com.electron.godzilla-pet

win:
  # 256x256 PNG，electron-builder 会自行转成 ICO。
  icon: assets/appicon.png

nsis:
  oneClick: true
  perMachine: false
